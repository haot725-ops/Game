<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3f8f4a">
<title>Nông Trại Bé Xíu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf4e2;--card:#fffaf0;--ink:#3b2a1d;--muted:#8a7762;--line:#ead9b8;--green:#3f8f4a;--green-d:#2e6f38;--red:#c94835;--gold:#e9a825;--soil:#8b5e3c;--chip:#f3e4c2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:600}
body{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(130px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
h3{font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;margin:0 0 6px;font-size:20px}
.muted{color:var(--muted);font-size:14px}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:8px;flex:1.3;min-width:0}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,#5cb85c,#2e6f38);display:grid;place-items:center;font-size:24px;box-shadow:0 3px 0 rgba(0,0,0,.18);flex:none}
.bn{font-family:'Baloo 2';font-weight:800;line-height:1;font-size:15px}
.stat{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.stat small{font-size:10px;letter-spacing:.08em;color:var(--muted);font-weight:800}
.stat b{font-family:'Baloo 2';font-size:19px;line-height:1.1;font-weight:800}
.stat b.gold{color:var(--gold)}
.help{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:20px;font-weight:800;flex:none}
.scene{position:relative;height:150px;overflow:hidden;background:var(--sky);transition:background .6s;--sky:linear-gradient(#8fd3ff,#dff4ff);--grass:#6fc254}
.scene[data-w=cloudy]{--sky:linear-gradient(#aebfcd,#e4ecf1)}
.scene[data-w=rain]{--sky:linear-gradient(#6a8399,#a9bccb)}
.scene[data-w=storm]{--sky:linear-gradient(#364156,#69778c)}
.scene[data-w=drought]{--sky:linear-gradient(#ff9f55,#ffe3a6)}
.scene[data-w=frost]{--sky:linear-gradient(#c6e3f5,#f4fbff)}
.scene[data-s="0"]{--grass:#8fd06b}.scene[data-s="1"]{--grass:#58ad45}.scene[data-s="2"]{--grass:#d6a444}.scene[data-s="3"]{--grass:#cfe0cb}
.scene[data-w=drought]{--grass:#c9a24a}
.hill{position:absolute;border-radius:50%;background:var(--grass);filter:brightness(.93)}
.h1{width:280px;height:160px;left:-60px;bottom:-95px}.h2{width:360px;height:180px;right:-90px;bottom:-110px;filter:brightness(1.04)}
.ground{position:absolute;left:0;right:0;bottom:0;height:34px;background:var(--grass);filter:brightness(1.06)}
.sun{position:absolute;top:14px;right:22px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,#fff7b0,#ffd23f);box-shadow:0 0 30px 12px rgba(255,210,63,.5)}
.scene[data-w=rain] .sun,.scene[data-w=storm] .sun,.scene[data-w=cloudy] .sun{opacity:.0}
.scene[data-w=drought] .sun{width:62px;height:62px;background:radial-gradient(circle,#fff,#ff6a2b);box-shadow:0 0 40px 18px rgba(255,100,40,.55)}
.scene[data-w=frost] .sun{opacity:.5;background:radial-gradient(circle,#fff,#cfe8ff);box-shadow:0 0 30px 10px rgba(255,255,255,.7)}
.cloud{position:absolute;font-size:34px;opacity:.9;animation:drift 38s linear infinite}
.c1{top:20px;left:-10%}.c2{top:50px;left:-40%;font-size:26px;animation-duration:52s}
@keyframes drift{to{transform:translateX(700px)}}
.deco{position:absolute;bottom:8px;font-size:38px}
.d1{left:16px;font-size:54px;bottom:12px}.d2{right:18px;font-size:44px}.d3{left:96px;font-size:22px;bottom:4px}.d4{right:80px;font-size:26px;bottom:2px}
.fx{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s}
.scene[data-w=rain] .fx,.scene[data-w=storm] .fx{opacity:1;background-image:linear-gradient(105deg,transparent 0 44%,rgba(255,255,255,.6) 45% 50%,transparent 51%);background-size:16px 30px;animation:rain .45s linear infinite}
@keyframes rain{to{background-position:-16px 30px}}
.scene[data-w=frost] .fx{opacity:1;background-image:radial-gradient(circle,#fff 2px,transparent 3px);background-size:26px 26px;animation:snow 3s linear infinite}
@keyframes snow{to{background-position:-13px 26px}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.scene[data-w=storm] .flash{animation:flash 4s infinite}
@keyframes flash{0%,92%,100%{opacity:0}94%{opacity:.7}96%{opacity:.1}98%{opacity:.6}}
.chips{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2;right:90px}
.sc{background:rgba(255,255,255,.88);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;scrollbar-width:none;position:sticky;top:66px;z-index:15;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:15px;position:relative}
.tab.on{background:#3b2a1d;color:#fff;border-color:#3b2a1d}
.tab i{position:absolute;top:-3px;right:-2px;background:var(--red);color:#fff;border-radius:999px;font-size:11px;font-style:normal;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
main{padding:2px 14px 14px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:14px;margin-bottom:14px;box-shadow:0 2px 0 rgba(120,90,40,.06)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.grow1{flex:1;min-width:0}
.seedbar{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.seedbar::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;background:var(--chip);font-weight:800;font-size:15px;border:2px solid transparent}
.chip.on{border-color:var(--green);background:#e1f3d8}
.bulk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.bulk button{padding:10px 4px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-weight:800;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.plot{aspect-ratio:1;border-radius:14px;background:linear-gradient(#9a6b45,#7d5535);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);color:#fff;overflow:hidden}
.plot:active{transform:scale(.96)}
.plot .pe{font-size:30px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.plot .pl{position:absolute;bottom:3px;left:0;right:0;font-size:9.5px;font-weight:800;opacity:.85;text-align:center}
.plot .pbar{position:absolute;left:8px;right:8px;bottom:16px;height:5px;background:rgba(0,0,0,.3);border-radius:9px;overflow:hidden}
.plot .pbar i{display:block;height:100%;background:#9be36a;border-radius:9px}
.plot .bd{position:absolute;font-size:13px;line-height:1}
.bd.tl{top:4px;left:5px}.bd.tr{top:4px;right:5px}.bd.bl{top:20px;left:5px}
.plot.wet{background:linear-gradient(#6d4a30,#573a25)}
.plot.gh{outline:2.5px solid #9fe0ff;outline-offset:-3px}
.plot.ready{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),0 0 0 3px #ffd23f}}
.plot.locked{background:repeating-linear-gradient(45deg,#e8dcc0,#e8dcc0 8px,#efe5cc 8px,#efe5cc 16px);color:var(--muted);box-shadow:none;border:1.5px dashed #cdb98e}
.plot.locked .pe{font-size:22px}.plot.locked .pp{font-size:11px;font-weight:800;margin-top:2px}
.plot.dead{background:linear-gradient(#6b5a50,#4f423a)}
.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:800;font-size:15px}
.seg button.on{background:#3b2a1d;color:#fff}
.item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;background:#fffdf7;border:1.5px solid var(--line);margin-bottom:10px}
.item.lock{opacity:.55}
.ico{width:52px;height:52px;border-radius:14px;background:var(--chip);display:grid;place-items:center;font-size:30px;flex:none}
.it-n{font-family:'Baloo 2';font-weight:800;font-size:18px;line-height:1.1}
.it-d{font-size:13px;color:var(--muted);line-height:1.3}
.btns{display:flex;gap:6px;flex:none}
.sb{padding:8px 12px;border-radius:12px;background:var(--chip);font-weight:800;font-size:14px;white-space:nowrap}
.sb.pri{background:var(--green);color:#fff}
.sb.red{background:var(--red);color:#fff}
.sb[disabled]{opacity:.4;pointer-events:none}
.up{color:#2e8b3d}.down{color:var(--red)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--chip);font-size:12px;font-weight:800}
.pill.g{background:#dff3d6;color:#2e6f38}.pill.r{background:#fbdcd5;color:#a5311f}.pill.y{background:#fdf0c4;color:#8a6200}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;background:#fffdf7;border-radius:26px 26px 0 0;border:1.5px solid var(--line);border-bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -6px 20px rgba(80,50,10,.1)}
.bar-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:15px}
.ebar{flex:1;height:12px;border-radius:99px;background:#eadfc6;overflow:hidden}
.ebar i{display:block;height:100%;background:linear-gradient(90deg,#f7c948,#e9a825);border-radius:99px;transition:width .3s}
.cta{width:100%;padding:16px;border-radius:20px;background:linear-gradient(#d4533e,#b93e2b);color:#fff;font-family:'Baloo 2';font-weight:800;font-size:20px;box-shadow:0 5px 0 #8f2e20}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #8f2e20}
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(40,25,10,.5)}
.panel{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;max-height:86vh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translate(-50%,40px);opacity:.4}}
.wbtn{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:16px;background:var(--chip);font-weight:800;margin-top:8px;font-size:15.5px}
.wbtn.pri{background:var(--green);color:#fff}.wbtn.red{background:var(--red);color:#fff}.wbtn.ghost{background:#fff;border:1.5px solid var(--line)}
.wbtn[disabled]{opacity:.4;pointer-events:none}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%) translateY(-20px);background:#3b2a1d;color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;font-size:14.5px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:92%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hearts{letter-spacing:2px;color:#e0556b;font-size:16px}
.perk{font-size:13.5px;padding:5px 0;color:var(--muted)}.perk.on{color:var(--green-d);font-weight:800}
.prog{height:8px;border-radius:9px;background:#eadfc6;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--green)}
.log{padding:8px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.log small{color:var(--muted);font-weight:800}
.note{background:#fff3cf;border-radius:14px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
svg.spark{width:100%;height:64px;background:#f6efd8;border-radius:12px}

.farm{position:relative;border-radius:24px;overflow:hidden;padding:10px 8px 10px;margin:0 0 14px;--g1:#6fbf4a;--g2:#65b441;
 background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.10) 0 2px,transparent 3px) 0 0/23px 23px,radial-gradient(circle at 70% 70%,rgba(0,0,0,.07) 0 2px,transparent 3px) 0 0/29px 29px,repeating-linear-gradient(0deg,var(--g1) 0 14px,var(--g2) 14px 28px);
 border:3px solid #4d8a33;box-shadow:inset 0 0 0 3px rgba(255,255,255,.14),0 3px 0 rgba(60,90,30,.25)}
.farm[data-s="1"]{--g1:#58ad45;--g2:#4fa23d}.farm[data-s="2"]{--g1:#bba641;--g2:#b09b38}.farm[data-s="3"]{--g1:#d3e3d1;--g2:#c6d9c4}
.trees{display:flex;justify-content:space-around;font-size:30px;line-height:1;margin-bottom:4px}
.trees span{filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}.trees.low{font-size:20px;margin:8px 0 0}
.trees span:nth-child(even){transform:translateY(4px)}
.yard{display:grid;grid-template-columns:1fr 112px 1fr;align-items:end;gap:6px}
.pen{position:relative;height:96px;border:5px solid #a9794a;border-radius:7px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 2px rgba(0,0,0,.14),0 3px 0 rgba(60,40,10,.25);overflow:hidden}
.pen::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 13px,rgba(110,70,30,.5) 13px 17px);opacity:.5;pointer-events:none}
.animal{position:absolute;font-size:25px;line-height:1;animation:wander 6s ease-in-out infinite alternate;filter:drop-shadow(0 3px 0 rgba(0,0,0,.22))}
@keyframes wander{to{transform:translateX(var(--dx,30px))}}
.sign{position:absolute;left:4px;right:4px;top:6px;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);line-height:1.25}
.barnbox{position:relative;display:flex;justify-content:center}
.barn{width:112px;height:auto;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
.dog{position:absolute;right:-2px;bottom:0;font-size:22px;animation:wander 4s ease-in-out infinite alternate;--dx:-16px}
.path{height:26px;width:46px;margin:4px auto 6px;border-radius:6px;background:repeating-conic-gradient(#b9b4a8 0 25%,#a39d90 0 50%) 0 0/16px 16px;box-shadow:0 0 0 3px #8f8a7d}
.fieldfence{border:5px solid #a9794a;border-radius:12px;padding:8px;background:rgba(70,45,15,.22);box-shadow:inset 0 0 0 2px rgba(0,0,0,.14),0 3px 0 rgba(60,40,10,.25);position:relative}
.plot{background:repeating-linear-gradient(0deg,#8f6240 0 7px,#7b4f31 7px 11px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),inset 0 0 0 2px rgba(255,255,255,.08)}
.plot.wet{background:repeating-linear-gradient(0deg,#6e4a30 0 7px,#5a3b26 7px 11px)}
.plot.dead{background:repeating-linear-gradient(0deg,#6e5d52 0 7px,#5a4b42 7px 11px)}
.plot.locked{background:rgba(255,255,255,.14);border:2px dashed rgba(255,255,255,.55);color:#fff;box-shadow:none;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.plot.locked .pe{font-size:22px}.plot.locked .pl{color:#fff}
.crops{display:grid;grid-template-columns:1fr 1fr;gap:0 4px;font-size:17px;line-height:1.1;margin-top:-6px}
.crops i{font-style:normal;text-align:center;display:block;min-height:19px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3));transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.crops i:nth-child(even){animation-delay:-1.4s}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">🌾</div><div class="bn">Nông Trại<br>Bé Xíu</div></div>
  <div class="stat"><small>NGÀY</small><b id="sDay">1</b></div>
  <div class="stat"><small>KÉT</small><b id="sMoney">0</b></div>
  <div class="stat"><small>DANH TIẾNG</small><b class="gold" id="sRep">★ 1.0</b></div>
  <button class="help" data-act="help">?</button>
</header>
<section class="scene" id="scene" data-w="sunny" data-s="0">
  <div class="sun"></div><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div>
  <div class="hill h1"></div><div class="hill h2"></div><div class="ground"></div>
  <div class="deco d1">🏡</div><div class="deco d2">🌳</div><div class="deco d3">🐓</div><div class="deco d4">🌻</div>
  <div class="fx"></div><div class="flash"></div>
  <div class="chips"><span class="sc" id="scSeason"></span><span class="sc" id="scWeather"></span><span class="sc" id="scFc"></span></div>
</section>
<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
<footer class="bar">
  <div class="bar-top"><span>⚡ Sức lực</span><div class="ebar"><i id="eFill"></i></div><b id="eTxt">16/16</b></div>
  <button class="cta" data-act="next">Ngủ &amp; sang ngày mới</button>
</footer>
<div class="sheet" id="sheet"><div class="backdrop" data-act="close"></div><div class="panel" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ============ DỮ LIỆU ============ */
const SAVE_KEY='nongtrai-be-xiu-v1';
const SN=['Xuân','Hạ','Thu','Đông'],SE=['🌸','☀️','🍂','❄️'];
const WEATHER={sunny:{n:'Nắng đẹp',e:'☀️'},cloudy:{n:'Âm u',e:'⛅'},rain:{n:'Mưa',e:'🌧️'},storm:{n:'Bão',e:'⛈️'},drought:{n:'Hạn hán',e:'🔥'},frost:{n:'Rét hại',e:'❄️'}};
const WEIGHTS=[
 {sunny:37,cloudy:25,rain:30,storm:5,drought:0,frost:3},
 {sunny:40,cloudy:15,rain:20,storm:10,drought:15,frost:0},
 {sunny:35,cloudy:25,rain:25,storm:10,drought:5,frost:0},
 {sunny:20,cloudy:40,rain:10,storm:0,drought:0,frost:30}];
const CROPS=[
 {id:'raumuong',n:'Rau muống',e:'🌿',seed:2,grow:2,price:3,yield:3,se:[0,1,2],rep:0},
 {id:'carot',n:'Cà rốt',e:'🥕',seed:3,grow:3,price:4.5,yield:3,se:[2,3,0],hardy:1,rep:0},
 {id:'ngo',n:'Ngô',e:'🌽',seed:4,grow:4,price:6,yield:3,se:[1,2],rep:0},
 {id:'cachua',n:'Cà chua',e:'🍅',seed:6,grow:4,price:7,yield:4,se:[0,1],regrow:2,rep:0},
 {id:'lua',n:'Lúa',e:'🌾',seed:5,grow:5,price:6,yield:5,se:[0,1],rep:10},
 {id:'khoaitay',n:'Khoai tây',e:'🥔',seed:6,grow:4,price:8.5,yield:3,se:[2,3,0],hardy:1,rep:15},
 {id:'bapcai',n:'Bắp cải',e:'🥬',seed:7,grow:5,price:10,yield:3,se:[3,0],hardy:1,rep:25},
 {id:'ot',n:'Ớt',e:'🌶️',seed:8,grow:5,price:12,yield:3,se:[1],regrow:3,rep:35},
 {id:'huongduong',n:'Hướng dương',e:'🌻',seed:10,grow:5,price:16,yield:3,se:[1,2],rep:50},
 {id:'bingo',n:'Bí ngô',e:'🎃',seed:12,grow:6,price:18,yield:3,se:[2],hardy:1,rep:65},
 {id:'dautay',n:'Dâu tây',e:'🍓',seed:16,grow:5,price:21,yield:3,se:[0],regrow:3,rep:80},
 {id:'duahau',n:'Dưa hấu',e:'🍉',seed:14,grow:6,price:23,yield:3,se:[1],rep:100},
 {id:'cafe',n:'Cà phê',e:'☕',seed:40,grow:9,price:48,yield:5,se:[2,3],regrow:5,rep:130},
 {id:'xoai',n:'Xoài',e:'🥭',seed:70,grow:10,price:75,yield:5,se:[1],regrow:5,rep:160},
 {id:'saurieng',n:'Sầu riêng',e:'🍈',seed:130,grow:12,price:160,yield:4,se:[1],regrow:6,rep:200}];
const CM={};CROPS.forEach(c=>CM[c.id]=c);
const TRAIT={

/* ============ TIỆN ÍCH ============ */
const $=s=>document.querySelector(s);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function wpick(w){const e=Object.entries(w);let r=Math.random()*e.reduce((s,x)=>s+x[1],0);for(const [k,v] of e){if((r-=v)<0)return k}return e[0][0]}
function fmt(k){k=Math.round(k);const a=Math.abs(k),s=k<0?'-':'';const f=x=>x.toFixed(1).replace(/\.0$/,'').replace('.',',');
 if(a>=1e6)return s+f(a/1e6)+' tỷ';if(a>=1000)return s+f(a/1000)+'tr';return s+a+'k'}
function fmtP(x){return (x>=10?String(Math.round(x)):x.toFixed(1).replace('.',','))+'k'}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ============ TRẠNG THÁI ============ */
let S=null,TAB='field',SUB='buy';
function newState(){
 const plots=PDEF.map((d,i)=>({id:i,owned:i<4,trait:d[0],base:d[1],paid:i<4?d[1]:0,crop:null,status:'',prog:0,moist:0,dry:0,pest:0,immune:0,ready:0,fert:false,gh:false,lease:false}));
 const s={v:1,day:1,money:300,rep:0,energy:16,plots,unpaid:false,weather:{today:'sunny',act:'sunny',fc:'sunny',dl:0},
  price:{},events:[],landIdx:1,landTrend:0,landHist:[1],inv:{seeds:{raumuong:6,carot:2},produce:{},fert:0,pest:0},
  up:{irrigation:0,fence:0,tools:0,workers:0,cart:0,seeds:0,storage:0,ratTrap:0},npc:{},orders:[],claimed:{},sg:null,loan:0,
  stats:{harvested:0,planted:0,earned:0,landProfit:0,upgrades:0,orders:0,types:{}},log:[],selSeed:'raumuong',nid:1,news:[],newsDay:0};
 CROPS.forEach(c=>s.price[c.id]={m:1,prev:1});
 Object.keys(NPCS).forEach(k=>s.npc[k]={aff:0,talked:false,gifted:false});
 return s}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const j=localStorage.getItem(SAVE_KEY);if(!j)return false;const o=JSON.parse(j),d=newState();
 S=Object.assign(d,o);['inv','up','stats','weather'].forEach(k=>S[k]=Object.assign(d[k],o[k]||{}));
 CROPS.forEach(c=>{if(!S.price[c.id])S.price[c.id]={m:1,prev:1}});Object.keys(NPCS).forEach(k=>{if(!S.npc[k])S.npc[k]={aff:0,talked:false,gifted:false}});return true}catch(e){return false}}
function startNew(){S=newState();S.weather.act=rollWeather(0);S.weather.fc=S.weather.act;newSeasonGoal();genOrder();log('🌱 Bắt đầu cuộc sống nông trại!')}

/* ============ HÀM TÍNH ============ */
const season=(d)=>Math.floor((((d||S.day)-1)%28)/7);
const owned=()=>S.plots.filter(p=>p.owned).length;
const perk=id=>{const a=S.npc[id].aff;return a>=60?2:a>=30?1:0};
const landPrice=p=>Math.max(20,Math.round(p.base*S.landIdx));
const landDisc=()=>[0,.05,.1][perk('anhKhoa')];
const upDisc=()=>[0,.1,.2][perk('chuTu')];
const irrN=()=>[0,3,8,16][S.up.irrigation];
const fenceMult=()=>[1,.5,.15][S.up.fence];
const wage=()=>[0,15,40,90][S.up.workers];
const cap=()=>[100,180,300,500][S.up.storage];
const maxEnergy=()=>16+4*S.up.tools+(S.unpaid?0:[0,6,12,20][S.up.workers]);
const used=()=>Object.values(S.inv.seeds).reduce((a,b)=>a+b,0)+Object.values(S.inv.produce).reduce((a,b)=>a+b,0);
const free=()=>cap()-used();
const netWorth=()=>Math.round(S.money+S.plots.filter(p=>p.owned).reduce((a,p)=>a+landPrice(p),0)-S.loan);
const title=()=>{let t=TITLES[0][1];TITLES.forEach(x=>{if(S.rep>=x[0])t=x[1]});return t};
const stars=()=>Math.min(5,1+S.rep/60);
const eventMult=id=>S.events.filter(e=>e.crop===id).reduce((a,e)=>a*e.mult,1);
function curPrice(c){return c.price*S.price[c.id].m*eventMult(c.id)*(c.se.includes(season())?0.92:1.12)}
function sellMult(){return 1+0.04*S.up.cart+[0,.05,.10][perk('coLan')]+(perk('anhKhoa')===2?.03:0)}
const unitSell=c=>curPrice(c)*sellMult();
const trend=c=>{const a=S.price[c.id];return a.m>a.prev+0.005?1:a.m<a.prev-0.005?-1:0};
function plotYield(p){let m=1;if(p.trait==='phusa')m=1.2;if(p.trait==='xau')m=.9;return m}
function growRate(p,c){const sm=p.gh?1:(c.se.includes(season())?1.25:.6);return sm*(p.fert?1.4:1)}
function pestChance(w){let c=.05*(w==='rain'||w==='storm'?1.5:1);c*=[1,.6,.3][perk('thayHung')];return c}
function log(t){S.log.unshift({d:S.day,t});if(S.log.length>80)S.log.length=80}
function addRep(x){const o=S.rep;S.rep+=x;CROPS.forEach(c=>{if(c.rep>o&&c.rep<=S.rep)toast(`🔓 Mở khoá hạt ${c.n} ${c.e}!`)})}
function useE(n){if(S.energy<n){toast('⚡ Hết sức lực rồi, ngủ thôi ông!');return false}S.energy-=n;return true}
function rollWeather(sn){const w=S.weather;if(w.dl>0){w.dl--;return 'drought'}const t=wpick(WEIGHTS[sn]);if(t==='drought')w.dl=ri(1,3);return t}
function kill(p,why){p.status='dead';p.why=why;p.pest=0}

/* ============ HÀNH ĐỘNG ============ */
function plantAt(p,cid,quiet){
 if(!p.owned||p.crop||p.lease)return false;if((S.inv.seeds[cid]||0)<1){toast('Hết hạt giống loại này');return false}
 if(!useE(1))return false;const c=CM[cid];S.inv.seeds[cid]--;
 Object.assign(p,{crop:cid,status:'grow',prog:0,moist:0,dry:0,pest:0,immune:0,ready:0,fert:false});
 S.stats.planted++;S.stats.types[cid]=1;if(S.sg&&S.sg.type==='plant'&&S.sg.crop===cid)S.sg.p++;
 return true}
function waterPlot(p){if(!p.crop||p.status!=='grow')return false;if(p.moist>=2){return false}
 const cost=S.weather.today==='drought'?2:1;if(!useE(cost))return false;p.moist=p.trait==='song'?3:2;return true}
function harvestPlot(p){if(p.status!=='ready')return false;const c=CM[p.crop];
 let n=c.yield*plotYield(p)*(1+.08*S.up.seeds)*(p.fert?1.2:1);n=Math.max(1,Math.round(n*(.85+Math.random()*.3)));
 if(free()<n){toast('📦 Kho đầy! Bán bớt hoặc mở rộng kho.');return false}
 if(!useE(1))return false;
 S.inv.produce[c.id]=(S.inv.produce[c.id]||0)+n;S.stats.harvested+=n;if(S.sg&&S.sg.type==='harvest')S.sg.p+=n;addRep(.3);
 if(c.regrow){p.prog=c.grow-c.regrow;p.status='grow';p.ready=0;p.moist=Math.max(0,p.moist)}else{p.crop=null;p.status='';p.prog=0;p.fert=false}
 toast(`${c.e} +${n} ${c.n}`);return true}
function sellUnits(cid,n){const c=CM[cid];n=Math.min(n,S.inv.produce[cid]||0);if(n<=0)return 0;let t=0;
 for(let i=0;i<n;i++){t+=unitSell(c);S.price[cid].m=Math.max(.5,S.price[cid].m*.985)}
 t=Math.round(t);S.inv.produce[cid]-=n;if(!S.inv.produce[cid])delete S.inv.produce[cid];S.money+=t;S.stats.earned+=t;if(S.sg&&S.sg.type==='earn')S.sg.p+=t;return t}
function newSeasonGoal(){const lvl=Math.floor(S.rep/25),t=pick(['harvest','earn','plant']);
 const g={type:t,p:0,claimed:false,money:Math.round(80+lvl*50),rep:4+lvl,sn:season()};
 if(t==='harvest'){g.target=12+4*lvl;g.txt=`Thu hoạch ${g.target} nông sản`}
 if(t==='earn'){g.target=Math.round(100+lvl*80);g.txt=`Kiếm ${fmt(g.target)} từ bán nông sản`}
 if(t==='plant'){const all=CROPS.filter(c=>S.rep>=c.rep),cs=all.filter(c=>c.se.includes(season()));const c=pick(cs.length?cs:all);g.crop=c.id;g.target=6;g.txt=`Gieo ${g.target} cây ${c.n} ${c.e}`}
 S.sg=g}
function genOrder(){const unl=CROPS.filter(c=>S.rep>=c.rep),c=pick(unl),npc=pick(Object.keys(NPCS));
 const qty=ri(3,8+Math.floor(S.rep/20));const mult=[1,1.15,1.3][perk('chiMai')];
 const reward=Math.round(qty*c.price*(1.35+Math.random()*.45)*mult);
 S.orders.push({id:S.nid++,npc,crop:c.id,qty,reward,dl:S.day+ri(4,8),rep:1+Math.floor(qty/5)})}

/* ============ QUA NGÀY ============ */
function nextDay(){
 const news=[];const w0=S.weather.today;let ready=0;
 S.plots.forEach(p=>{if(!p.owned||!p.crop)return;const c=CM[p.crop];
  if(p.status==='ready'){p.ready++;if(p.ready>=6){kill(p,'thối rữa vì để quá lâu');news.push(`🍂 ${c.e} lô ${p.id+1} bị thối vì không thu hoạch`)}return}
  if(p.status!=='grow')return;
  if(p.pest>0){p.pest++;if(p.pest>=4){kill(p,'bị sâu ăn trụi');news.push(`🐛 ${c.e} lô ${p.id+1} bị sâu ăn trụi`)}return}
  if(p.moist>0){p.prog+=growRate(p,c);p.moist--;p.dry=0}
  else{p.dry++;if(p.dry>=(w0==='drought'?2:3)){kill(p,'héo khô vì thiếu nước');news.push(`🥀 ${c.e} lô ${p.id+1} chết khô vì thiếu nước`);return}}
  if(p.prog>=c.grow){p.status='ready';p.ready=0;ready++;return}
  if(p.immune>0)p.immune--;else if(Math.random()<pestChance(w0)){p.pest=1;news.push(`🐛 Sâu bệnh xuất hiện ở lô ${p.id+1} (${c.e})`)}});
 if(ready)news.push(`✅ ${ready} lô đã chín, ra gặt thôi!`);
 /* sang ngày */
 const prevSn=season(S.day);S.day++;const sn=season();
 S.weather.today=S.weather.act;S.weather.act=rollWeather(season(S.day+1));
 S.weather.fc=(perk('thayHung')>=1||Math.random()<.75)?S.weather.act:wpick(WEIGHTS[season(S.day+1)]);
 const w=S.weather.today;news.unshift(`${WEATHER[w].e} Hôm nay: ${WEATHER[w].n}`);
 if(sn!==prevSn){
  if(S.sg&&!S.sg.claimed&&S.sg.p>=S.sg.target){S.money+=S.sg.money;addRep(S.sg.rep);news.push(`🎁 Tự nhận thưởng vụ mùa: +${fmt(S.sg.money)}`)}
  else if(S.sg&&!S.sg.claimed)news.push('⌛ Mục tiêu vụ mùa trước chưa hoàn thành');
  news.push(`${SE[sn]} Sang mùa ${SN[sn]}!`);newSeasonGoal()}
 /* thời tiết tác động */
 const planted=S.plots.filter(p=>p.owned&&p.crop&&p.status!=='dead');
 if(w==='rain'||w==='storm')planted.forEach(p=>{if(p.status==='grow')p.moist=Math.max(p.moist,p.trait==='song'?3:2)});
 if(w==='storm'){let n=0;planted.forEach(p=>{if(p.gh)return;const ch=.35*fenceMult()*(p.trait==='doi'?.5:1);if(Math.random()<ch){kill(p,'bị bão quật đổ');n++}});
  news.push(n?`⛈️ Bão quật đổ ${n} lô cây!`:'⛈️ Bão qua, may mà cây vẫn trụ vững')}
 if(w==='frost'){let n=0;planted.forEach(p=>{if(p.gh)return;if(Math.random()<(CM[p.crop].hardy?.1:.4)){kill(p,'chết cóng vì rét hại');n++}});if(n)news.push(`❄️ Rét hại làm chết ${n} lô cây`)}
 if(w==='drought'){planted.forEach(p=>{if(p.status==='grow'&&!p.gh)p.moist=Math.max(0,p.moist-1)});news.push('🔥 Hạn hán: đất khô nhanh, tưới tốn 2 sức lực')}
 /* tưới tự động */
 let n=irrN();if(n){const cand=S.plots.filter(p=>p.owned&&p.crop&&p.status==='grow'&&p.moist<2).sort((a,b)=>a.moist-b.moist);
  cand.slice(0,n).forEach(p=>p.moist=p.trait==='song'?3:2);if(cand.length)news.push(`🚰 Hệ thống tưới đã tưới ${Math.min(n,cand.length)} lô`)}
 if(perk('baBa')===2){const cand=S.plots.filter(p=>p.owned&&p.crop&&p.status==='grow'&&p.moist<1).sort(()=>Math.random()-.5).slice(0,2);
  cand.forEach(p=>p.moist=2);if(cand.length)news.push(`👴 Bác Ba tưới giúp ${cand.length} lô`)}
 /* tiền nong */

 if(S.loan>0){const i=Math.ceil(S.loan*.005);S.loan+=i;news.push(`🏦 Lãi vay hôm nay: ${i}k (nợ ${fmt(S.loan)})`)}

 if(S.day%7===1&&S.day>1){
  if(perk('baBa')>=1){const c=pick(CROPS.filter(c=>S.rep>=c.rep)),k=Math.min(5,Math.max(0,free()));if(k>0){S.inv.seeds[c.id]=(S.inv.seeds[c.id]||0)+k;news.push(`👴 Bác Ba biếu ${k} hạt ${c.n} ${c.e}`)}}

 const oc=.5+(perk('chiMai')===2?.2:0);if(S.orders.length<4&&Math.random()<oc){genOrder();const o=S.orders[S.orders.length-1];news.push(`📦 ${NPCS[o.npc].n} đặt ${o.qty} ${CM[o.crop].n}`)}

 S.energy=maxEnergy();S.news=news;S.newsDay=S.day;news.forEach(t=>log(t));save()}
function randomEvent(news){if(Math.random()>.14)return;const r=Math.random(),unl=CROPS.filter(c=>S.rep>=c.rep);
 if(r<.22){const c=pick(unl);S.events.push({crop:c.id,mult:1.35,days:3});news.push(`🎪 Hội chợ nông sản: ${c.n} ${c.e} tăng giá 35% trong 3 ngày`)}
 else if(r<.42){const c=pick(unl);S.events.push({crop:c.id,mult:.75,days:3});news.push(`📉 Thương lái ép giá: ${c.n} ${c.e} giảm 25% trong 3 ngày`)}

 else if(r<.9){const c=pick(unl),n=Math.min(ri(3,6),Math.max(0,free()));if(n>0){S.inv.seeds[c.id]=(S.inv.seeds[c.id]||0)+n;news.push(`🎁 Nhặt được ${n} hạt ${c.n} ${c.e}`)}}

 return h}
function viewFriends(){
 return `<div class="note">Trò chuyện (2 sức lực) hoặc tặng quà mỗi ngày để tăng hảo cảm. Đạt 30 và 60 hảo cảm sẽ mở đặc quyền.</div>`+Object.keys(NPCS).map(k=>{const n=NPCS[k],a=S.npc[k],hr=Math.min(5,Math.floor(a.aff/20));
  return `<div class="card"><div class="row"><div class="ico">${n.e}</div><div class="grow1"><div class="it-n">${n.n}</div><div class="it-d">${n.role} · thích ${n.likes.map(i=>CM[i].e).join(' ')}</div></div><div class="hearts">${'♥'.repeat(hr)}${'♡'.repeat(5-hr)}</div></div>
  <div class="prog"><i style="width:${a.aff}%"></i></div><div class="muted" style="margin:4px 0 6px">Hảo cảm ${Math.floor(a.aff)}/100</div>
  <div class="perk ${a.aff>=30?'on':''}">${a.aff>=30?'✅':'🔒'} (30) ${n.perks[0]}</div><div class="perk ${a.aff>=60?'on':''}">${a.aff>=60?'✅':'🔒'} (60) ${n.perks[1]}</div>
  <div class="row" style="margin-top:10px">${sb(a.talked?'Đã trò chuyện':'💬 Trò chuyện','talk',k,'',a.talked)}${sb(a.gifted?'Đã tặng quà':'🎁 Tặng quà','giftOpen',k,'',a.gifted)}</div></div>`}).join('')}
function viewUpgrade(){
 return `<div class="note">${upDisc()?`Chú Tư giảm ${upDisc()*100}% giá nâng cấp cho ông. `:''}Nhà kính xây riêng cho từng lô đất (mở menu ô đất).</div>`+UPS.map(u=>{const l=S.up[u.id],max=l>=u.max,cost=max?0:Math.round(u.cost[l]*(1-upDisc()));
  return `<div class="item"><div class="ico">${u.e}</div><div class="grow1"><div class="it-n">${u.n} <span class="pill">${l}/${u.max}</span></div><div class="it-d">Hiện tại: ${u.d(l)}${max?'':`<br>Cấp sau: ${u.d(l+1)}`}</div></div><div class="btns">${max?'<span class="pill g">Tối đa</span>':sb(fmt(cost),'buyUp',u.id,'pri',S.money<cost)}</div></div>`}).join('')}
function viewLog(){return `<div class="card"><h3>Nhật ký</h3>`+(S.log.length?S.log.map(l=>`<div class="log"><small>Ngày ${l.d}</small> · ${l.t}</div>`).join(''):'<div class="muted">Chưa có gì.</div>')+`</div>`}

function plotSheet(id){
 const p=S.plots[id],t=TRAIT[p.trait],pr=landPrice(p);let h=`<h3>Lô ${id+1} · ${t.n}</h3><div class="muted">${t.d}</div><div style="margin:10px 0">`;
 if(!p.owned){const cost=Math.round(pr*(1-landDisc()));
  h+=`<div class="kv"><span>Giá đất hôm nay</span><b>${fmt(cost)}</b></div></div>`+B(`Mua lô đất này · ${fmt(cost)}`,'buyPlot',id,'pri',S.money<cost)}
 else{
  h+=`<div class="kv"><span>Giá trị đất</span><b>${fmt(pr)}</b></div><div class="kv"><span>Đã mua</span><b>${fmt(p.paid)}</b></div>${p.gh?'<div class="kv"><span>Nhà kính</span><b>Có 🏠</b></div>':''}</div>`;
  if(p.crop&&p.status==='grow'){const c=CM[p.crop];
   h+=`<div class="kv"><span>${c.e} ${c.n}</span><b>${Math.min(100,Math.floor(p.prog/c.grow*100))}%</b></div><div class="kv"><span>Độ ẩm</span><b>${p.moist>0?'💧 còn '+p.moist+' ngày':'Khô'}</b></div>${p.pest?'<div class="kv"><span>Sâu bệnh</span><b class="down">🐛 '+p.pest+'/4 ngày</b></div>':''}`;
   h+=B(`💧 Tưới nước (${S.weather.today==='drought'?2:1} sức)`,'water',id,'',p.moist>=2);
   if(p.pest){h+=B(`🧴 Phun thuốc (1 sức, còn ${S.inv.pest})`,'treat',id+'|drug','pri',S.inv.pest<1);h+=B('✋ Bắt sâu bằng tay (2 sức)','treat',id+'|hand')}
   h+=B(`🧪 Bón phân (còn ${S.inv.fert})`,'fert',id,'',S.inv.fert<1||p.fert);
   h+=B('🗑️ Nhổ bỏ (1 sức)','clear',id,'ghost')}
  else if(p.crop&&p.status==='ready')h+=B(`🧺 Thu hoạch ${CM[p.crop].e}`,'harvest',id,'pri');
  else if(p.crop&&p.status==='dead'){h+=`<div class="note">Cây ${CM[p.crop].n} ${p.why}.</div>`+B('🧹 Dọn dẹp (1 sức)','clear',id,'pri')}
  else if(p.lease){h+=`<div class="note">Đang cho thuê, thu khoảng ${Math.round(pr*.006)}k/ngày.</div>`+B('Thu hồi đất','lease',id,'pri')}
  else{
   const ss=CROPS.filter(c=>(S.inv.seeds[c.id]||0)>0);
   h+=ss.length?ss.map(c=>B(`${c.e} Gieo ${c.n} (còn ${S.inv.seeds[c.id]}) · ${c.se.includes(season())?'✅ đúng mùa':'⚠️ trái mùa'}`,'plantHere',id+'|'+c.id)).join(''):'<div class="note">Chưa có hạt giống. Ra Chợ mua nha.</div>';
   h+=B(`🏷️ Cho thuê (+${Math.round(pr*.006)}k/ngày)`,'lease',id,'ghost')}
  if(!p.gh){const gc=Math.round(400*(1-upDisc()));h+=B(`🏠 Xây nhà kính · ${fmt(gc)} (chống bão, rét, lớn đều quanh năm)`,'buildGh',id,'ghost',S.money<gc)}
  if(!p.crop&&owned()>1){const sp=Math.round(pr*.92);h+=B(`💵 Bán đất · ${fmt(sp)} (${sp-p.paid>=0?'lãi':'lỗ'} ${fmt(Math.abs(sp-p.paid))})`,'sellPlot',id,'red')}}
 h+=B('Đóng','close','','ghost');openSheet(h)}

/* ============ SỰ KIỆN BẤM ============ */
const ACT={
 tab(a){TAB=a;render();window.scrollTo({top:0})},
 sub(a){SUB=a;render()},
 close(){closeSheet()},
 selSeed(a){S.selSeed=a||null;render()},
 plot(a){const p=S.plots[+a];
  if(p.owned&&!p.crop&&!p.lease&&S.selSeed&&(S.inv.seeds[S.selSeed]||0)>0&&$('#sheet').classList.contains('open')===false){if(plantAt(p,S.selSeed)){save();render()}return}
  if(p.owned&&p.status==='ready'&&$('#sheet').classList.contains('open')===false){if(harvestPlot(p)){save();render()}return}
  if(p.owned&&p.status==='dead'&&$('#sheet').classList.contains('open')===false){if(useE(1)){p.crop=null;p.status='';save();render()}return}
  plotSheet(+a)},
 plantHere(a){const [i,c]=a.split('|'),p=S.plots[+i];if(plantAt(p,c)){closeSheet();save();render()}},
 water(a){const p=S.plots[+a];if(waterPlot(p)){closeSheet();save();render()}},
 fert(a){const p=S.plots[+a];if(S.inv.fert<1||p.fert||!useE(1))return;S.inv.fert--;p.fert=true;toast('🧪 Đã bón phân');closeSheet();save();render()},
 treat(a){const [i,m]=a.split('|'),p=S.plots[+i];if(m==='drug'){if(S.inv.pest<1)return;if(!useE(1))return;S.inv.pest--;p.pest=0;p.immune=4;toast('🧴 Sâu đã bị diệt, miễn dịch 4 ngày')}else{if(!useE(2))return;p.pest=0;toast('✋ Đã bắt sạch sâu')}closeSheet();save();render()},
 harvest(a){if(harvestPlot(S.plots[+a])){closeSheet();save();render()}},
 clear(a){const p=S.plots[+a];if(!useE(1))return;p.crop=null;p.status='';p.prog=0;p.fert=false;p.pest=0;closeSheet();save();render()},
 buyPlot(a){const p=S.plots[+a],cost=Math.round(landPrice(p)*(1-landDisc()));if(S.money<cost)return toast('Không đủ tiền mua đất');
  S.money-=cost;p.owned=true;p.paid=cost;toast(`🏞️ Đã mua lô ${p.id+1} với giá ${fmt(cost)}`);log(`🏞️ Mua lô ${p.id+1} giá ${fmt(cost)}`);closeSheet();save();render()},
 sellPlot(a){const p=S.plots[+a];if(p.crop||owned()<=1)return;const sp=Math.round(landPrice(p)*.92);S.money+=sp;S.stats.landProfit+=sp-p.paid;
  log(`💵 Bán lô ${p.id+1} giá ${fmt(sp)} (${sp-p.paid>=0?'lãi':'lỗ'} ${fmt(Math.abs(sp-p.paid))})`);toast(`💵 Bán đất được ${fmt(sp)}`);Object.assign(p,{owned:false,paid:0,lease:false,gh:false,crop:null,status:''});closeSheet();save();render()},
 lease(a){const p=S.plots[+a];p.lease=!p.lease;closeSheet();save();render()},
 buildGh(a){const p=S.plots[+a],c=Math.round(400*(1-upDisc()));if(S.money<c)return;S.money-=c;p.gh=true;S.stats.upgrades++;toast('🏠 Đã xây nhà kính');closeSheet();save();render()},
 waterAll(){let n=0;for(const p of S.plots){if(p.owned&&p.status==='grow'&&p.moist<2){if(!waterPlot(p))break;n++}}toast(n?`💧 Đã tưới ${n} lô`:'Không có lô nào cần tưới');save();render()},
 harvestAll(){let n=0;for(const p of S.plots){if(p.owned&&p.status==='ready'){if(!harvestPlot(p))break;n++}}if(!n)toast('Chưa có lô nào chín');save();render()},
 plantAll(){if(!S.selSeed||!(S.inv.seeds[S.selSeed]>0))return toast('Chọn hạt giống ở thanh phía trên trước nha');let n=0;
  for(const p of S.plots){if(p.owned&&!p.crop&&!p.lease){if(!plantAt(p,S.selSeed))break;n++}}toast(n?`🌱 Đã gieo ${n} lô`:'Không có lô trống');save();render()},
 buySeed(a){const [id,n]=a.split('|'),c=CM[id],k=+n;if(S.money<c.seed*k)return toast('Không đủ tiền');if(free()<k)return toast('📦 Kho đầy!');
  S.money-=c.seed*k;S.inv.seeds[id]=(S.inv.seeds[id]||0)+k;if(!S.selSeed)S.selSeed=id;toast(`Mua ${k} hạt ${c.n} ${c.e}`);save();render()},
 buyItem(a){const [t,n]=a.split('|'),k=+n,pr=t==='fert'?8:10;if(S.money<pr*k)return toast('Không đủ tiền');S.money-=pr*k;S.inv[t]+=k;toast('Đã mua');save();render()},
 sell(a){const [id,n]=a.split('|'),t=sellUnits(id,n==='all'?9999:+n);if(t)toast(`💰 +${fmt(t)}`);save();render()},
 sellAll(){let t=0;Object.keys(S.inv.produce).forEach(id=>t+=sellUnits(id,9999));if(t)toast(`💰 Bán hết, thu ${fmt(t)}`);save();render()},
 deliver(a){const o=S.orders.find(x=>x.id==a);if(!o||(S.inv.produce[o.crop]||0)<o.qty)return;S.inv.produce[o.crop]-=o.qty;if(!S.inv.produce[o.crop])delete S.inv.produce[o.crop];
  S.money+=o.reward;S.stats.earned+=o.reward;S.stats.orders++;S.npc[o.npc].aff=Math.min(100,S.npc[o.npc].aff+6);addRep(o.rep);S.orders=S.orders.filter(x=>x!==o);
  toast(`📦 Giao đơn xong, +${fmt(o.reward)}`);log(`📦 Giao ${o.qty} ${CM[o.crop].n} cho ${NPCS[o.npc].n}: +${fmt(o.reward)}`);save();render()},
 claim(a){const m=MILES.find(x=>x.id===a);if(!m||S.claimed[a]||m.p()<m.tg)return;S.claimed[a]=1;S.money+=m.m;addRep(m.r);toast(`🏆 ${m.t}: +${fmt(m.m)}`);log(`🏆 Hoàn thành "${m.t}"`);save();render()},
 claimSeason(){const g=S.sg;if(!g||g.claimed||g.p<g.target)return;g.claimed=true;S.money+=g.money;addRep(g.rep);toast(`🎁 Thưởng vụ mùa +${fmt(g.money)}`);save();render()},
 buyUp(a){const u=UPS.find(x=>x.id===a),l=S.up[a];if(l>=u.max)return;const c=Math.round(u.cost[l]*(1-upDisc()));if(S.money<c)return toast('Không đủ tiền');
  S.money-=c;S.up[a]++;S.stats.upgrades++;if(a==='tools'||a==='workers')S.energy+=a==='tools'?4:[0,6,6,8][S.up.workers];toast(`${u.e} Đã nâng cấp ${u.n}`);log(`🔧 Nâng cấp ${u.n} lên cấp ${S.up[a]}`);save();render()},
 talk(a){const n=NPCS[a],x=S.npc[a];if(x.talked||!useE(2))return;x.talked=true;const g=ri(2,4);x.aff=Math.min(100,x.aff+g);toast(`${n.e} ${n.n}: "${pick(n.lines)}" (+${g}♥)`);save();render()},
 giftOpen(a){const n=NPCS[a],ks=CROPS.filter(c=>(S.inv.produce[c.id]||0)>0);
  openSheet(`<h3>Tặng quà cho ${n.n} ${n.e}</h3><div class="muted">Thích: ${n.likes.map(i=>CM[i].e+' '+CM[i].n).join(', ')}</div>`+(ks.length?ks.map(c=>B(`${c.e} ${c.n} (có ${S.inv.produce[c.id]}) ${n.likes.includes(c.id)?'· ❤️ rất thích':''}`,'gift',a+'|'+c.id,n.likes.includes(c.id)?'pri':'')).join(''):'<div class="note">Ông chưa có nông sản nào để tặng.</div>')+B('Đóng','close','','ghost'))},
 gift(a){const [k,c]=a.split('|'),x=S.npc[k],n=NPCS[k];if(x.gifted||(S.inv.produce[c]||0)<1)return;S.inv.produce[c]--;if(!S.inv.produce[c])delete S.inv.produce[c];x.gifted=true;
  const g=n.likes.includes(c)?8:3;x.aff=Math.min(100,x.aff+g);toast(`${n.e} ${n.n} rất vui! +${g}♥`);closeSheet();save();render()},
 loan(a){S.loan+=+a;S.money+=+a;toast(`🏦 Đã vay ${fmt(+a)}`);log(`🏦 Vay ngân hàng ${fmt(+a)}`);save();render()},
 repay(){const p=Math.min(S.loan,Math.floor(S.money));if(p<=0)return;S.loan-=p;S.money-=p;toast(`🏦 Đã trả ${fmt(p)}`);save();render()},
 next(){if(S.energy>0&&S.plots.some(p=>p.owned&&p.status==='ready')&&!ACT.next.ok){ACT.next.ok=1;toast('Còn lô chín chưa gặt kìa! Bấm lần nữa nếu muốn ngủ');setTimeout(()=>ACT.next.ok=0,2500);return}
  ACT.next.ok=0;nextDay();render();window.scrollTo({top:0});morning()},
 help(){openSheet(`<h3>Cách chơi 🌾</h3><div class="muted" style="line-height:1.55;color:var(--ink)">
 <b>1.</b> Mua hạt ở <b>Chợ</b>, chọn hạt trên thanh Ruộng rồi chạm ô đất trống để gieo.<br>
 <b>2.</b> Tưới nước (mưa cũng tưới giúp). Nước giữ ẩm 2 ngày. Cây lớn nhanh khi đúng mùa.<br>
 <b>3.</b> Coi chừng <b>sâu bệnh 🐛</b>, <b>hạn hán 🔥</b>, <b>bão ⛈️</b>, <b>rét ❄️</b>. Xem dự báo ở góc trên.<br>
 <b>4.</b> Gặt rồi bán ở Chợ, giá lên xuống mỗi ngày. Đừng bán dồn một lúc.<br>
 <b>5.</b> Mua <b>đất</b> như BĐS: mua khi giá thấp, bán khi giá cao, hoặc cho thuê.<br>
 <b>6.</b> Làm <b>nhiệm vụ</b>, kết bạn với 6 người trong xóm để mở đặc quyền.<br>
 <b>7.</b> Mỗi ngày có số <b>sức lực</b> giới hạn, nâng cấp để làm được nhiều hơn.<br><br>Game tự lưu trong máy.</div>`+B('🗑️ Chơi lại từ đầu','reset','','red')+B('Đóng','close','','ghost'))},
 reset(){if(confirm('Xoá hết tiến trình và chơi lại từ đầu?')){try{localStorage.removeItem(SAVE_KEY)}catch(e){}startNew();TAB='field';closeSheet();save();render()}}};
function morning(){if(!S.news.length)return;openSheet(`<h3>🌅 Sáng ngày ${S.day}</h3>`+S.news.map(t=>`<div class="log">${t}</div>`).join('')+B('Bắt đầu ngày mới','close','','pri'))}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f)f(el.dataset.arg===undefined?'':el.dataset.arg,el)});
if(!load())startNew();
render();save();
window.__G={get S(){return S},ACT,nextDay,render};
</script>
